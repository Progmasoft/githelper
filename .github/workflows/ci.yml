name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"

  install-posix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: Install into a home of its own, then with -p
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home" "$RUNNER_TEMP/dest"
          HOME="$home" SHELL=/bin/bash sh ./install.sh
          test -x "$home/.local/bin/githelper"
          grep -q 'Added by githelper' "$home/.bash_profile" "$home/.profile" 2>/dev/null
          HOME="$home" SHELL=/bin/bash sh ./install.sh | grep -q 'already'
          HOME="$home" SHELL=/bin/zsh sh ./install.sh -p "$RUNNER_TEMP/dest"
          "$RUNNER_TEMP/dest/githelper" --help | grep -q 'Guarded Git workflow'
          grep -qF "$RUNNER_TEMP/dest" "$home/.zprofile"
          HOME="$home" SHELL=/usr/bin/fish sh ./install.sh
          grep -q 'fish_add_path' "$home/.config/fish/conf.d/githelper.fish"
          if sh ./install.sh -p "$RUNNER_TEMP/missing"; then exit 1; fi
          sh ./install.sh -h | grep -q 'Usage: install.sh'
          if sh ./install.sh -H; then exit 1; fi

  install-windows:
    name: install.cmd and Install-Githelper.ps1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: install.cmd
        shell: cmd
        run: |
          call install.cmd || exit /b 1
          if not exist "%USERPROFILE%\.local\bin\githelper.exe" exit /b 1
          mkdir "%RUNNER_TEMP%\cmd-dest"
          call install.cmd /path:%RUNNER_TEMP%\cmd-dest || exit /b 1
          if not exist "%RUNNER_TEMP%\cmd-dest\githelper.exe" exit /b 1
          call install.cmd /path%RUNNER_TEMP%\cmd-dest /globalenv || exit /b 1
          call install.cmd /path:%RUNNER_TEMP%\missing && exit /b 1
          call install.cmd /GLOBALENV && exit /b 1
          call install.cmd /help | findstr /C:"Usage: install.cmd" || exit /b 1
          call install.cmd /? | findstr /C:"/globalenv" || exit /b 1
          exit /b 0
      - name: Install-Githelper.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Install-Githelper.ps1
          if (-not (Test-Path "$env:USERPROFILE\.local\bin\githelper.exe")) { exit 1 }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\ps-dest" | Out-Null
          ./Install-Githelper.ps1 -path "$env:RUNNER_TEMP\ps-dest" -globalenvironment
          if (-not (Test-Path "$env:RUNNER_TEMP\ps-dest\githelper.exe")) { exit 1 }
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (-not ($machine -split ';' -contains "$env:RUNNER_TEMP\ps-dest")) { exit 1 }
          & pwsh -NoProfile -File ./Install-Githelper.ps1 -Path "$env:RUNNER_TEMP\missing"
          if ($LASTEXITCODE -eq 0) { exit 1 }
          ./Install-Githelper.ps1 -HELP | Out-String | Select-String 'GlobalEnvironment' | Out-Null
          exit 0

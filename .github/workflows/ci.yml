name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"

  install-posix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: Install into a home of its own, then with -p
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home" "$RUNNER_TEMP/dest"
          HOME="$home" SHELL=/bin/bash sh ./install.sh
          test -x "$home/.local/bin/githelper"
          grep -q 'Added by githelper' "$home/.bash_profile" "$home/.profile" 2>/dev/null
          HOME="$home" SHELL=/bin/bash sh ./install.sh | grep 'already' >/dev/null
          HOME="$home" SHELL=/bin/zsh sh ./install.sh -p "$RUNNER_TEMP/dest"
          "$RUNNER_TEMP/dest/githelper" --help | grep 'Guarded Git workflow' >/dev/null
          grep -qF "$RUNNER_TEMP/dest" "$home/.zprofile"
          HOME="$home" SHELL=/usr/bin/fish sh ./install.sh
          grep -q 'fish_add_path' "$home/.config/fish/conf.d/githelper.fish"
          if sh ./install.sh -p "$RUNNER_TEMP/missing"; then exit 1; fi
          sh ./install.sh -h | grep 'Usage: install.sh' >/dev/null
          if sh ./install.sh -H; then exit 1; fi

  install-windows:
    name: install.cmd and Install-Githelper.ps1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # install.cmd runs in cmd.exe, called from PowerShell, so that every check stops the step when
      # it fails; a cmd shell step goes on after a failed line.
      - name: install.cmd
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Install([bool] $isGood, [string] $what) {
            if (-not $isGood) { throw "install.cmd: $what" }
          }
          cmd /d /c install.cmd
          Assert-Install ($LASTEXITCODE -eq 0) 'the default install failed'
          Assert-Install (Test-Path "$env:USERPROFILE\.local\bin\githelper.exe") 'no githelper.exe in .local\bin'
          New-Item -ItemType Directory "$env:RUNNER_TEMP\cmd-dest" | Out-Null
          cmd /d /c install.cmd "/path:$env:RUNNER_TEMP\cmd-dest"
          Assert-Install ($LASTEXITCODE -eq 0) '/path: failed'
          Assert-Install (Test-Path "$env:RUNNER_TEMP\cmd-dest\githelper.exe") 'no githelper.exe in /path:'
          cmd /d /c install.cmd "/path$env:RUNNER_TEMP\cmd-dest" /globalenv
          Assert-Install ($LASTEXITCODE -eq 0) '/path without a colon and /globalenv failed'
          cmd /d /c install.cmd "/path:$env:RUNNER_TEMP\missing"
          Assert-Install ($LASTEXITCODE -ne 0) 'a missing /path: directory was accepted'
          cmd /d /c install.cmd /GLOBALENV
          Assert-Install ($LASTEXITCODE -ne 0) '/GLOBALENV without /path was accepted'
          $usage = cmd /d /c install.cmd /help | Out-String
          Assert-Install ($usage -match 'Usage: install\.cmd') '/help shows no usage'
          $usage = cmd /d /c install.cmd /? | Out-String
          Assert-Install ($usage -match '/globalenv') '/? shows no /globalenv'
          exit 0
      - name: Install-Githelper.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Install-Githelper.ps1
          if (-not (Test-Path "$env:USERPROFILE\.local\bin\githelper.exe")) { exit 1 }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\ps-dest" | Out-Null
          ./Install-Githelper.ps1 -path "$env:RUNNER_TEMP\ps-dest" -globalenvironment
          if (-not (Test-Path "$env:RUNNER_TEMP\ps-dest\githelper.exe")) { exit 1 }
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (-not ($machine -split ';' -contains "$env:RUNNER_TEMP\ps-dest")) { exit 1 }
          & pwsh -NoProfile -File ./Install-Githelper.ps1 -Path "$env:RUNNER_TEMP\missing"
          if ($LASTEXITCODE -eq 0) { exit 1 }
          ./Install-Githelper.ps1 -HELP | Out-String | Select-String 'GlobalEnvironment' | Out-Null
          exit 0
